    - "gcp_logging_metrics"
    - "gcp_monitoring_alert_policies"
    - "gcp_networksecurity_*"
    - "gcp_pubsub_*"
    - "gcp_resourcemanager_*"
    - "gcp_resourcemanager_project_tag_bindings"
    - "gcp_resourcemanager_project_tag_keys"
    - "gcp_run_services"
    - "gcp_serviceusage_*"
    - "gcp_sql_instances"
